<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>色弱绘画原型 - 实时渲染</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toolbar">
        <input type="color" id="colorPicker" value="#FF0000">

        <label>粗细: <input type="range" id="sizeSlider" min="1" max="50" value="10"></label>
        <button id="eraserBtn" style="padding: 5px 10px; cursor: pointer;">橡皮擦</button>
        <botton id="clearBtn" style="padding: 5px 10px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">清空画布</botton>
        
        <label>严重程度: <span id="levelValue">0</span></label>
        <input type="range" id="levelSlider" min="0" max="100" value="0">
        <label>
            <input type="radio" name="mode" value="simulate" checked> 模拟
        </label>
        <label>
            <input type="radio" name="mode" value="enhance"> 增强
        </label>

        <label>
            类型:
            <select id="cvdTypeSelect" style="padding: 5px; border-radius: 5px;">
                <option value="deuteranomaly">红绿色弱</option>
                <option value="tritanomaly">蓝黄色弱</option>
            </select>
        </label>
    </div>

    <div style="margin-bottom: 15px;">
        <button id="startTestBtn" style="padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;">开始色弱测试</button>
    </div>

    <div id="testModal" style="display: none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;">
        <div style="background: #333; padding: 30px; border-radius: 10px; text-align: center; max-width: 600px;">
            <h2>请选择你觉得最难区分的两组颜色:</h2>
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
                
                <button class="test-btn" data-type="redGreen" style="padding: 20px; cursor:pointer; border: 2px solid transparent; border-radius: 8px; background: #222;">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="width: 40px; height: 40px; background: #FF0000;"></div>
                        <div style="width: 40px; height: 40px; background: #00FF00;"></div>
                    </div>
                    <span style="color: white;">红色与绿色</span>
                </button>

                <button class="test-btn" data-type="blueYellow" style="padding: 20px; cursor:pointer; border: 2px solid transparent; border-radius: 8px; background: #222;">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="width: 40px; height: 40px; background: #0000FF;"></div>
                        <div style="width: 40px; height: 40px; background: #FFFF00;"></div>
                    </div>
                    <span style="color: white;">蓝色与黄色</span>
                </button>

                <button class="test-btn" data-type="normal" style="padding: 20px; cursor: pointer; border: 2px solid transparent; border-radius: 8px; background: #222;">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="width: 40px; height: 40px; background: #999;"></div>
                        <div style="width: 40px; height: 40px; background: #999;"></div>
                    </div>
                    <span style="color: white;">可分辨</span>
                </button>
            </div>
        </div>
    </div>

    <canvas id="drawingCanvas" width="800" height="600"></canvas>

    <script src="app.js"></script>
</body>
</html>
